name: FactoryPulse CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-TypeScript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend-TypeScript/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm audit --audit-level=high

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend-python/requirements.txt
      - run: python -m pip install -r requirements.txt pip-audit
      - run: python -m unittest discover -s . -p 'test_*.py' -v
      - run: pip-audit -r requirements.txt

  docker:
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: backend-python
          push: false
          tags: factorypulse-api:${{ github.sha }}
      
      - name: Start full stack with docker compose
        run: docker compose up -d --build

      - name: Test Nginx Reverse Proxy and Backend Health
        run: |
          for  i in {1..15}: do
            if curl -s -f http://localhost/api/health | grep -q "ok"; then
              echo "Nginx and backend are up and running"
              exit 0
            fi
            sleep 2
          done
          echo "Nginx or backend failed to start"
          docker compose logs
          exit 1
          
      - name: Stop containers
        if: always()
        run: docker-compose down
    
