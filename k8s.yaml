apiVersion: apps/v1
kind: Deployment
metadata:
  name: factorypulse-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: factorypulse-backend
  template:
    metadata:
     labels:
        app: factorypulse-backend
    spec:
      containers:
       - name: backend
         image: uptime-backend:latest
         imagePullPolicy: Never
         ports:
          - containerPort: 8000

---
apiVersion: v1
kind: Service
metadata:
  name: factorypulse-backend-service
spec:
  type: LoadBalancer
  selector:
    app: factorypulse-backend
  ports:
     - protocol: TCP
       port: 8000
       targetPort: 8000  
